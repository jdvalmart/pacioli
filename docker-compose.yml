services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pacioli
      POSTGRES_PASSWORD: pacioli
      POSTGRES_DB: pacioli
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacioli"]
      interval: 5s
      timeout: 2s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pacioli:pacioli@db:5432/pacioli
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main, web]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        working-directory: backend
        run: ruff check .
      - name: MyPy (types)
        working-directory: backend
        run: mypy app tests
      - name: Pytest
        working-directory: backend
        run: pytest -q

  backend-postgres:
    # Production runs on Postgres: run the same suite against it so
    # dialect differences fail here instead of at runtime.
    name: Backend (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pacioli
          POSTGRES_PASSWORD: pacioli
          POSTGRES_DB: pacioli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacioli"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    env:
      PACIOLI_TEST_DATABASE_URL: postgresql://pacioli:pacioli@localhost:5432/pacioli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Pytest (Postgres)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # The real app (FastAPI serving the built SPA) driven by Playwright.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: API types are up to date
        # Regenerate src/lib/api-schema.ts from the backend contract and fail
        # if it differs from the committed file (run `npm run gen:api`).
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
